name: Build Magisk Module

on:
  workflow_dispatch:
  push:
    branches: [ master, main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install NDK r27c
        run: $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "ndk;27.2.12479018"

      - name: Compile Zygisk Library
        run: $ANDROID_HOME/ndk/27.2.12479018/ndk-build -C module

      - name: Package Magisk Module Zip
        run: |
          mkdir -p out_mod/zygisk
          cat << 'EOF' > out_mod/module.prop
          id=pxm_loader
          name=PXM Library Loader
          version=v1.0
          versionCode=1
          author=pocox
          description=Loads libPXM.so into com.subg.imobile
          EOF
          cp module/libs/arm64-v8a/*.so out_mod/zygisk/arm64-v8a.so
          cp module/libs/armeabi-v7a/*.so out_mod/zygisk/armeabi-v7a.so
          if [ -d "module/src/main/system" ]; then
            cp -r module/src/main/system out_mod/
            rm -f out_mod/system/lib64/keep.txt
          fi
          cd out_mod && zip -r ../PXM-Magisk-Module.zip .

      - name: Upload Module Zip
        uses: actions/upload-artifact@v4
        with:
          name: PXM-Magisk-Module
          path: PXM-Magisk-Module.zip
